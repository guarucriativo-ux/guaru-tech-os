<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Registro: kameleon-organico. Duotone verde é FIXO (identidade do modelo) — só o texto/
     marca do cliente vem do brand-dna (TEXT_ON_BOX). Foto real recortada via clip-path. */
  #post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #FAF9F1;
    font-family: "Poppins", Arial, Helvetica, sans-serif;
  }

  #headline {
    position: absolute;
    top: 60px;
    left: 64px;
    width: 560px;
    font-size: 42px;
    font-weight: 400;
    color: #1F2E1A;
    line-height: 1.25;
    z-index: 6;
  }
  #headline b { font-weight: 800; }

  #blob-light {
    position: absolute;
    left: -60px;
    top: 280px;
    width: 1180px;
    height: 900px;
    z-index: 1;
  }
  #blob-light path { fill: #BFE38A; }

  #blob-dark {
    position: absolute;
    left: 520px;
    top: 230px;
    width: 600px;
    height: 600px;
    z-index: 2;
  }
  #blob-dark path { fill: #6FA33A; }

  #photo {
    position: absolute;
    left: 330px;
    top: 330px;
    width: 760px;
    height: 820px;
    z-index: 3;
    clip-path: path("M60,420 C20,220 220,40 460,30 C700,20 760,220 740,420 C720,640 700,820 480,810 C260,800 100,640 60,420 Z");
    box-shadow: 0 30px 50px rgba(20,40,10,0.18);
  }
  #photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
  }

  .sticker {
    position: absolute;
    z-index: 5;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.18));
  }

  #avatar-row {
    position: absolute;
    left: 64px;
    bottom: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 6;
  }
  .mini-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid #FAF9F1;
    margin-left: -16px;
  }
  .mini-avatar:first-child { margin-left: 0; }
  #avatar-row .plus {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #6FA33A;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: -16px;
  }
  #avatar-row span {
    font-size: 20px;
    color: #1F2E1A;
    font-weight: 500;
    margin-left: 8px;
    max-width: 380px;
  }
</style>
</head>
<body>
  <div id="post">
    <div id="headline">{{HEADLINE_HTML}}</div>

    <div id="blob-light">
      <svg viewBox="0 0 1180 900" preserveAspectRatio="none">
        <path d="M80,500 C-20,300 140,80 420,40 C700,0 980,80 1100,280 C1180,420 1100,620 900,740 C680,880 380,860 200,760 C120,710 130,600 80,500 Z" />
      </svg>
    </div>
    <div id="blob-dark">
      <svg viewBox="0 0 600 600" preserveAspectRatio="none">
        <path d="M40,320 C-20,180 100,40 260,20 C420,0 560,100 580,260 C600,420 480,560 320,580 C160,600 100,460 40,320 Z" />
      </svg>
    </div>

    <div id="photo">
      <img src="{{ASSET_PATH}}" alt="foto recortada do registro kameleon-organico" />
    </div>

    <div class="sticker" style="left:760px; top:300px; width:90px; height:90px; transform:rotate(-12deg);">
      <svg viewBox="0 0 90 40" width="90" height="40">
        <rect x="0" y="0" width="90" height="40" rx="10" fill="#E85D75"/>
        <circle cx="20" cy="20" r="6" fill="#FAF9F1"/>
      </svg>
    </div>
    <div class="sticker" style="left:840px; top:380px; width:100px; transform:rotate(8deg);">
      <svg viewBox="0 0 100 40" width="100" height="40">
        <circle cx="26" cy="20" r="17" fill="none" stroke="#1F2E1A" stroke-width="5"/>
        <circle cx="74" cy="20" r="17" fill="none" stroke="#1F2E1A" stroke-width="5"/>
        <line x1="43" y1="18" x2="57" y2="18" stroke="#1F2E1A" stroke-width="5"/>
      </svg>
    </div>

    <div id="avatar-row">
      <div class="mini-avatar" style="background:#E2C9A0;"></div>
      <div class="mini-avatar" style="background:#A9C9A4;"></div>
      <div class="plus">+</div>
      <span>{{CAPTION_TEXT}}</span>
    </div>
  </div>
</body>
</html>
