<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#cfcabd; }
  #post{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#EFE8DB;
    font-family:'Poppins',sans-serif; color:#1F3B52;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:84px 96px 96px;
  }
  /* textura de papel sutil */
  #post::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* swirl decorativo */
  .swirl{ position:absolute; top:-120px; right:-160px; width:620px; height:620px; opacity:.5; z-index:0; }
  .swirl path{ fill:none; stroke:#C9BEA6; stroke-width:1.4; }

  .header{ position:relative; z-index:2; text-align:center;
    font-size:23px; font-weight:600; letter-spacing:7px; color:#B5905A; }
  .header span{ color:#1F3B52; font-weight:300; }

  .center{ position:relative; z-index:2; text-align:center; margin-top:-40px; }
  .setup{ font-size:46px; font-weight:300; line-height:1.28; color:#36506A; }
  .setup b{ font-weight:600; color:#1F3B52; }
  .accent{ display:inline-block; margin-top:14px; padding:0 6px;
    font-family:'Cormorant Garamond',serif; font-style:italic; }
  .anchor{ font-family:'Pinyon Script', cursive; font-weight:400;
    font-size:240px; line-height:.9; color:#1F3B52; margin-top:6px; }
  .flourish{ width:300px; height:24px; margin:6px auto 0; opacity:.85; }
  .flourish path{ fill:none; stroke:#B5905A; stroke-width:1.6; }

  .cta{ position:relative; z-index:2; text-align:center; }
  .pill{ display:inline-block; border:1.6px solid #B5905A; border-radius:40px;
    padding:14px 34px; font-size:21px; font-weight:600; letter-spacing:5px; color:#B5905A; }
</style>
</head>
<body>
  <div id="post">
    <svg class="swirl" viewBox="0 0 620 620"><path d="M620,300 a300,300 0 1,1 -8,-70 M560,300 a240,240 0 1,1 -10,-58"/></svg>

    <div class="header">PSI <span>·</span> SAÚDE MENTAL</div>

    <div class="center">
      <div class="setup">O cansaço que o sono<br>não cura tem <b>um nome</b>:</div>
      <div class="anchor">ansiedade</div>
      <svg class="flourish" viewBox="0 0 300 24"><path d="M4,12 C70,2 110,22 150,12 C190,2 230,22 296,12"/></svg>
    </div>

    <div class="cta"><span class="pill">VEJA NA LEGENDA &#8601;</span></div>
  </div>
</body>
</html>
