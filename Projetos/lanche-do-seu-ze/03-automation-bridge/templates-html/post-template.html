<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /*
    Recriação direta de reference_frankenstein.png (Estúdio MONA): payoff gigante, condensado,
    sangrando pela borda esquerda do frame — não cabe, não deveria caber. Setup pequeno no
    canto oposto (tensão diagonal). Nada centralizado. Ver learning-log.md.
  */
  #post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(165deg, #1a1830 0%, #3a2a4d 35%, #7a3f4d 60%, #d97a4a 85%, #f0a860 100%);
    font-family: {{FONT_FAMILY}};
  }

  #post-bg {
    position: absolute;
    inset: 0;
    filter: blur(7px);
  }

  .silhouette {
    position: absolute;
    bottom: 0;
    background: rgba(10, 8, 20, 0.55);
    border-radius: 40px 40px 10px 10px;
  }

  .streak {
    position: absolute;
    height: 8px;
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,230,180,0.8) 50%, rgba(255,255,255,0) 100%);
  }

  #post-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 30%, rgba(10,8,20,0.55) 100%);
  }

  /* Setup: canto superior direito, fino, pequeno — exatamente onde a MONA põe o subtítulo. */
  #post-setup {
    position: absolute;
    top: 64px;
    right: 64px;
    width: 320px;
    color: {{TEXT_ON_BOX}};
    font-weight: 500;
    text-transform: lowercase;
    font-size: 28px;
    line-height: 1.25;
    text-align: right;
    z-index: 3;
  }

  /*
    Payoff: o herói. Condensado, gigante, sangrando pela esquerda (left negativo + overflow do
    #post corta de verdade). Largura menor que o canvas pra forçar quebra de linha em bloco
    empilhado, como FRAN/KENS/TEIN na referência.
  */
  #post-payoff {
    position: absolute;
    left: -55px;
    top: 300px;
    width: 880px;
    color: {{BG_COLOR}};
    font-weight: 900;
    text-transform: lowercase;
    font-size: 168px;
    line-height: 0.92;
    letter-spacing: -4px;
    text-align: left;
    z-index: 2;
  }
</style>
</head>
<body>
  <div id="post">
    <div id="post-bg">
      <div class="silhouette" style="left:40px; width:60px; height:220px; opacity:0.85;"></div>
      <div class="silhouette" style="left:150px; width:46px; height:170px; opacity:0.65;"></div>
      <div class="silhouette" style="left:850px; width:70px; height:260px; opacity:0.9;"></div>
      <div class="silhouette" style="left:960px; width:50px; height:190px; opacity:0.7;"></div>
      <div class="silhouette" style="left:700px; width:40px; height:150px; opacity:0.5;"></div>
      <div class="streak" style="top:300px; left:-40px; width:380px; transform:rotate(-4deg);"></div>
      <div class="streak" style="top:760px; left:600px; width:480px; transform:rotate(3deg);"></div>
      <div class="streak" style="top:180px; left:650px; width:300px; transform:rotate(-2deg);"></div>
    </div>
    <div id="post-vignette"></div>

    <div id="post-payoff">{{PAYOFF_TEXT}}</div>
    <div id="post-setup">{{SETUP_TEXT}}</div>
  </div>
</body>
</html>
