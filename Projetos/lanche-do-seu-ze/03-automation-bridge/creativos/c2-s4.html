<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }
  #post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--dark); font-family:"Montserrat",sans-serif; }
  #photo { position:absolute; inset:0; z-index:1; }
  #photo img { width:100%; height:100%; object-fit:cover; object-position:50% 60%; }
  #scrim { position:absolute; inset:0; z-index:2;
    background: linear-gradient(180deg, rgba(225,38,28,0.86) 0%, rgba(168,22,15,0.30) 34%, rgba(20,12,8,0) 56%),
                linear-gradient(0deg, rgba(20,12,8,0.85) 0%, rgba(20,12,8,0) 34%); }
  #kicker { position:absolute; top:60px; left:0; width:100%; text-align:center; z-index:6; color:var(--cream);
    font-weight:700; font-size:28px; letter-spacing:0.18em; text-transform:uppercase; }
  #headline { position:absolute; top:150px; left:56px; width:980px; z-index:6; }
  #headline .l1 { font-family:"Anton",sans-serif; color:var(--cream); font-size:108px; line-height:0.92; text-transform:uppercase; text-shadow:0 4px 14px rgba(0,0,0,0.4); }
  #headline .anchor { display:block; font-family:"Pacifico",cursive; color:var(--mustard); font-size:124px; line-height:0.9; margin-top:8px; transform:rotate(-4deg); }
  #delivery { position:absolute; bottom:0; left:0; width:100%; z-index:7; display:flex; align-items:center; justify-content:center; gap:14px;
    padding:34px 0; background:var(--cream); color:var(--dark); font-weight:700; font-size:26px; letter-spacing:0.12em; text-transform:uppercase; }
  #delivery .dot { color:var(--red); }
</style></head>
<body><div id="post">
  <div id="photo"><img src="../assets/foodporn-burger.jpg" alt="hamburguer" /></div>
  <div id="scrim"></div>
  <div id="kicker">LANCHE DO SEU ZÉ</div>
  <div id="headline">
    <span class="l1">HAMBÚRGUER DE VERDADE<br>TEM CHEIRO DE CHAPA.</span>
    <span class="anchor">vem provar</span>
  </div>
  <div id="delivery">IFOOD <span class="dot">•</span> RAPPI <span class="dot">•</span> UBER EATS <span class="dot">•</span> BALCÃO</div>
</div></body></html>
