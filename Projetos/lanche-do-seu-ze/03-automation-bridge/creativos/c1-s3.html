<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }
  #post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--red); font-family:"Montserrat",sans-serif; }
  /* foto topo, sangrando pra baixo na diagonal (inverso do S1 pra variar) */
  #photo { position:absolute; left:0; top:0; width:1080px; height:760px; z-index:4;
    clip-path: polygon(0 0, 100% 0, 100% 86%, 0 100%); box-shadow:0 18px 40px rgba(0,0,0,0.30); }
  #photo img { width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
  #halftone { position:absolute; bottom:40px; left:-40px; width:1160px; height:520px; z-index:1;
    background-image:radial-gradient(var(--deep) 30%, transparent 32%); background-size:26px 26px; opacity:0.5;
    -webkit-mask-image:linear-gradient(0deg,#000 60%,transparent 100%); mask-image:linear-gradient(0deg,#000 60%,transparent 100%); }
  #headline { position:absolute; left:60px; bottom:150px; z-index:6; width:1000px; }
  #headline .pre { font-family:"Luckiest Guy",cursive; color:var(--cream); font-size:78px; line-height:0.95; text-shadow:5px 5px 0 var(--deep); }
  #headline .anchor { display:block; font-family:"Luckiest Guy",cursive; color:var(--mustard); font-size:168px; line-height:0.88; margin-top:6px; text-shadow:7px 7px 0 var(--deep); }
  #seal { position:absolute; right:64px; bottom:80px; z-index:7; width:200px; height:200px; background:var(--cream);
    border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center; transform:rotate(-9deg);
    border:6px solid var(--mustard); box-shadow:0 12px 26px rgba(0,0,0,0.32); }
  #seal span { font-family:"Pacifico",cursive; color:var(--red); font-size:40px; line-height:0.95; }
</style></head>
<body><div id="post">
  <div id="photo"><img src="../assets/fries.jpg" alt="batata frita" /></div>
  <div id="halftone"></div>
  <div id="headline">
    <div class="pre">E ainda tem a</div>
    <div class="anchor">BATATA<br>CROCANTE</div>
  </div>
  <div id="seal"><span>na régua!</span></div>
</div></body></html>
