<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }

  #post { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--dark); }

  #photo { position: absolute; inset: 0; z-index: 1; }
  #photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }

  /* scrims pra legibilidade: topo (kicker) e base (headline) */
  #scrim {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(180deg, rgba(20,12,8,0.72) 0%, rgba(20,12,8,0) 24%),
      linear-gradient(0deg, rgba(20,12,8,0.88) 0%, rgba(20,12,8,0.30) 34%, rgba(20,12,8,0) 56%);
  }

  /* kicker da marca com chama */
  #kicker {
    position: absolute; top: 56px; left: 0; width: 100%; z-index: 6;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    color: var(--cream); font-family:"Montserrat"; font-weight: 700;
    font-size: 26px; letter-spacing: 0.26em; text-transform: uppercase;
  }
  #kicker .flame { color: var(--mustard); font-size: 30px; }

  /* tag vermelha kicker do tema */
  #tag {
    position: absolute; left: 76px; bottom: 432px; z-index: 7;
    background: var(--red); color: var(--cream);
    font-family:"Montserrat"; font-weight:700; font-size: 24px;
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 6px; transform: rotate(-2deg);
  }

  #headline { position: absolute; left: 72px; bottom: 150px; z-index: 7; width: 940px; }
  #headline .l1 {
    font-family: "Anton", sans-serif; color: var(--cream);
    font-size: 118px; line-height: 0.92; text-transform: uppercase; letter-spacing: 0.005em;
    text-shadow: 0 4px 18px rgba(0,0,0,0.55);
  }
  #headline .anchor {
    display: block; font-family: "Pacifico", cursive; color: var(--mustard);
    font-size: 132px; line-height: 0.9; margin-top: 6px; transform: rotate(-4deg);
    text-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <div id="post">
    <div id="photo"><img src="../assets/chapa-1.jpg" alt="hamburguer na chapa" /></div>
    <div id="scrim"></div>
    <div id="kicker">LANCHE DO SEU ZÉ <span class="flame">▲</span> NA CHAPA DESDE SEMPRE</div>
    <div id="tag">SÓ AQUI</div>
    <div id="headline">
      <span class="l1">AQUI O SMASH<br>É NA</span>
      <span class="anchor">chapa quente</span>
    </div>
  </div>
</body>
</html>
