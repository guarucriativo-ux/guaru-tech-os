<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }
  #post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--dark); }
  #photo { position:absolute; inset:0; z-index:1; }
  #photo img { width:100%; height:100%; object-fit:cover; object-position:50% 38%; }
  #scrim { position:absolute; inset:0; z-index:2;
    background: linear-gradient(0deg, rgba(20,12,8,0.90) 6%, rgba(20,12,8,0.20) 42%, rgba(20,12,8,0) 60%); }
  #tag { position:absolute; left:76px; bottom:476px; z-index:7; background:var(--red); color:var(--cream);
    font-family:"Montserrat"; font-weight:700; font-size:24px; letter-spacing:0.16em; text-transform:uppercase;
    padding:12px 22px; border-radius:6px; transform:rotate(-2deg); box-shadow:0 8px 18px rgba(0,0,0,0.4); }
  #headline { position:absolute; left:72px; bottom:150px; z-index:7; width:960px; }
  #headline .l1 { font-family:"Anton",sans-serif; color:var(--cream); font-size:104px; line-height:0.95; text-transform:uppercase; text-shadow:0 4px 16px rgba(0,0,0,0.55); }
  #headline .anchor { display:block; font-family:"Pacifico",cursive; color:var(--mustard); font-size:120px; line-height:0.9; margin-top:8px; transform:rotate(-4deg); text-shadow:0 6px 18px rgba(0,0,0,0.6); }
</style></head>
<body><div id="post">
  <div id="photo"><img src="../assets/chapa-2.jpg" alt="patties na chapa" /></div>
  <div id="scrim"></div>
  <div id="tag">O SEGREDO É O BLEND</div>
  <div id="headline">
    <span class="l1">CARNE FRESCA,<br>PRENSADA</span>
    <span class="anchor">na hora</span>
  </div>
</div></body></html>
