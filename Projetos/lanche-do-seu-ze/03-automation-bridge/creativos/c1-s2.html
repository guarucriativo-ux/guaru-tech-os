<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }
  #post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--dark); font-family:"Montserrat",sans-serif; }
  #photo { position:absolute; inset:0; z-index:1; }
  #photo img { width:100%; height:100%; object-fit:cover; object-position:50% 45%; }
  #scrim { position:absolute; inset:0; z-index:2;
    background: linear-gradient(0deg, rgba(20,12,8,0.92) 4%, rgba(20,12,8,0.25) 40%, rgba(20,12,8,0) 60%); }
  #kicker { position:absolute; top:60px; left:76px; z-index:6; color:var(--mustard); font-weight:700;
    font-size:30px; letter-spacing:0.16em; text-transform:uppercase; transform:rotate(-3deg); }
  #headline { position:absolute; left:64px; bottom:150px; z-index:6; width:1000px; }
  #headline .l { font-family:"Luckiest Guy",cursive; color:var(--cream); font-size:128px; line-height:0.92; text-shadow:6px 6px 0 var(--deep); }
  #headline .anchor { color:var(--mustard); }
  #drips { position:absolute; left:64px; bottom:110px; z-index:6; width:520px; height:40px; }
  #drips path { fill:var(--mustard); }
</style></head>
<body><div id="post">
  <div id="photo"><img src="../assets/chapa-burger.jpg" alt="cheese pull" /></div>
  <div id="scrim"></div>
  <div id="kicker">// olha esse queijo</div>
  <div id="headline">
    <div class="l">O QUEIJO QUE</div>
    <div class="l"><span class="anchor">escorre</span> não mente.</div>
  </div>
</div></body></html>
