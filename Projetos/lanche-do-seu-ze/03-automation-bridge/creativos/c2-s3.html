<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#E1261C; --deep:#A8160F; --cream:#F4EBD9; --mustard:#F4B400; --dark:#201813; }
  /* registro creme ilustrado (ref. Flippin' Good Fries / Border Burrito) */
  #post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--cream); font-family:"Montserrat",sans-serif; }
  #kicker { position:absolute; top:84px; left:0; width:100%; text-align:center; z-index:6; color:var(--red);
    font-weight:700; font-size:28px; letter-spacing:0.24em; text-transform:uppercase; }
  #headline { position:absolute; top:150px; left:0; width:100%; text-align:center; z-index:6; }
  #headline .l1 { font-family:"Anton",sans-serif; color:var(--dark); font-size:128px; line-height:0.9; text-transform:uppercase; }
  #headline .anchor { display:block; font-family:"Pacifico",cursive; color:var(--red); font-size:150px; line-height:0.85; margin-top:4px; transform:rotate(-3deg); }
  /* doodles em linha vermelha */
  .doodle { position:absolute; z-index:4; }
  .doodle path, .doodle line, .doodle circle, .doodle ellipse, .doodle rect { fill:none; stroke:var(--red); stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
  #d-bun { top:560px; left:90px; width:300px; height:200px; }
  #d-sauce { top:600px; right:90px; width:300px; height:230px; }
  #footer { position:absolute; bottom:120px; left:0; width:100%; text-align:center; z-index:6;
    font-family:"Anton",sans-serif; color:var(--dark); font-size:84px; line-height:0.95; text-transform:uppercase; }
  #footer b { color:var(--red); }
  #stamp { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); z-index:6; color:var(--red);
    font-family:"Montserrat"; font-weight:700; font-size:24px; letter-spacing:0.2em; text-transform:uppercase; }
</style></head>
<body><div id="post">
  <div id="kicker">// ingrediente de verdade</div>
  <div id="headline">
    <div class="l1">PÃO E MOLHO</div>
    <div class="anchor">da casa</div>
  </div>
  <svg id="d-bun" class="doodle" viewBox="0 0 300 200">
    <path d="M20,90 C20,30 280,30 280,90 Z"/>
    <circle cx="110" cy="62" r="3.5"/><circle cx="160" cy="54" r="3.5"/><circle cx="205" cy="63" r="3.5"/>
    <path d="M18,100 C60,130 100,84 150,118 C200,150 240,92 282,118"/>
    <path d="M20,150 C20,205 280,205 280,150 Z"/>
  </svg>
  <svg id="d-sauce" class="doodle" viewBox="0 0 300 230">
    <!-- bisnaga de molho -->
    <path d="M150,30 L162,30 L160,14 L152,14 Z"/>
    <line x1="156" y1="44" x2="156" y2="30"/>
    <rect x="116" y="44" width="80" height="150" rx="22"/>
    <line x1="124" y1="104" x2="188" y2="104"/>
    <line x1="124" y1="120" x2="188" y2="120"/>
    <!-- pingo saindo -->
    <path d="M156,8 C160,2 168,2 166,9"/>
  </svg>
  <div id="footer">SEM ATALHO. <b>SÓ SABOR.</b></div>
  <div id="stamp">• clean label burger •</div>
</div></body></html>
