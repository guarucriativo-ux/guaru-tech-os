<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /*
    Modelo 6c do catálogo (café aconchegante, ref. King's Café & Bar): foto real full-bleed,
    overlay de texto pequeno+bold caps no canto, toque manuscrito, legenda-detalhe no rodapé.
    Scrim escuro à esquerda é CSS meu (a foto já veio mais sombreada ali, reforço pra garantir
    legibilidade) — algo que a API do Canva não me deixaria fazer com controle fino.
  */
  #post {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    font-family: "Georgia", "Times New Roman", serif;
  }
  #post img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(10,8,6,0.75) 0%, rgba(10,8,6,0.45) 32%, rgba(10,8,6,0) 58%);
  }

  #brand {
    position: absolute;
    top: 56px;
    right: 56px;
    color: #F4EDE2;
    font-size: 20px;
    letter-spacing: 2px;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 5;
  }

  #headline {
    position: absolute;
    top: 110px;
    left: 64px;
    width: 480px;
    z-index: 5;
  }
  #headline .small {
    color: #F4EDE2;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.25;
    font-family: Arial, Helvetica, sans-serif;
  }
  #headline .big {
    color: #FFFFFF;
    font-size: 58px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
    margin: 6px 0;
    font-family: Arial, Helvetica, sans-serif;
    text-transform: uppercase;
  }

  #script {
    position: absolute;
    top: 540px;
    left: 70px;
    color: #F4EDE2;
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: 52px;
    font-style: italic;
    transform: rotate(-4deg);
    z-index: 5;
    opacity: 0.92;
  }

  #footer-label {
    position: absolute;
    bottom: 200px;
    left: 64px;
    color: #E7C9A0;
    font-size: 22px;
    font-style: italic;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 5;
  }
  #footer-big {
    position: absolute;
    bottom: 140px;
    left: 64px;
    color: #FFFFFF;
    font-size: 44px;
    font-weight: 800;
    font-family: Arial, Helvetica, sans-serif;
    text-transform: uppercase;
    z-index: 5;
  }
  #footer-detail {
    position: absolute;
    bottom: 95px;
    left: 64px;
    width: 700px;
    color: #F4EDE2;
    font-size: 24px;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="post">
    <img class="bg" src="assets/pizza.png" alt="pizza artesanal recém-saída do forno" />
    <div id="scrim"></div>

    <div id="brand">forno da vila</div>

    <div id="headline">
      <div class="small">o que uma pizzaria tem que</div>
      <div class="big">nenhum delivery<br>genérico</div>
      <div class="small">conseguiu copiar?</div>
    </div>

    <div id="script">fresquinha, todo dia.</div>

    <div id="footer-label">toda quinta é dia da pizza</div>
    <div id="footer-big">alerta de sabor:</div>
    <div id="footer-detail">borda recheada de catupiry + suco natural da casa</div>
  </div>
</body>
</html>
