<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #post img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Pedido explícito: imagem mais escura pra escrita destacar — scrim cheio, não só gradiente. */
  #scrim {
    position: absolute;
    inset: 0;
    background: rgba(8, 6, 10, 0.66);
  }

  #tag {
    position: absolute;
    top: 56px;
    left: 56px;
    color: #FFFFFF;
    font-size: 22px;
    letter-spacing: 2px;
    z-index: 5;
  }
  #slide-num {
    position: absolute;
    top: 56px;
    right: 56px;
    color: #d8d8d8;
    font-size: 22px;
    z-index: 5;
  }

  #label {
    position: absolute;
    left: 64px;
    top: 320px;
    color: #FF4D4D;
    font-family: "Anton", sans-serif;
    font-size: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 5;
  }

  #headline {
    position: absolute;
    left: 60px;
    top: 370px;
    width: 960px;
    color: #FFFFFF;
    font-family: "Anton", sans-serif;
    font-size: 92px;
    line-height: 1.04;
    text-transform: uppercase;
    z-index: 5;
  }

  #body {
    position: absolute;
    left: 64px;
    bottom: 90px;
    width: 800px;
    color: #EAEAEA;
    font-size: 30px;
    line-height: 1.4;
    z-index: 5;
  }

  #swipe-cue {
    position: absolute;
    left: 64px;
    bottom: 90px;
    color: #FF4D4D;
    font-family: "Anton", sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="post">
    <img class="bg" src="assets/parede-grafite.png" alt="parede com grafite urbano" />
    <div id="scrim"></div>

    <div id="tag">raíz urbana · curso de grafite</div>
    <div id="slide-num">{{SLIDE_NUM}}</div>

    <div id="label">{{LABEL}}</div>
    <div id="headline">{{HEADLINE}}</div>
    <div id="body">{{BODY}}</div>
    {{SWIPE_CUE}}
  </div>
</body>
</html>
