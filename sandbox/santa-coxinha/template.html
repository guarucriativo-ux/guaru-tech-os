<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #1a0d03;
    font-family: "Baloo 2", Arial, sans-serif;
  }
  #post img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: {{OBJECT_POSITION}};
    transform: scale({{ZOOM}});
  }
  #scrim {
    position: absolute;
    inset: 0;
    background: {{SCRIM}};
  }

  #tag {
    position: absolute;
    top: 56px;
    left: 56px;
    color: #FFE5B0;
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 600;
    z-index: 5;
  }
  #slide-num {
    position: absolute;
    top: 56px;
    right: 56px;
    color: #FFE5B0;
    font-size: 22px;
    opacity: 0.8;
    z-index: 5;
  }

  #label {
    position: absolute;
    left: 56px;
    top: 128px;
    z-index: 5;
    display: {{LABEL_DISPLAY}};
  }
  #label span {
    display: inline-block;
    background: #FFA103;
    color: #3D1F0A;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 24px;
    border-radius: 999px;
    transform: rotate(-3deg);
  }

  #headline {
    position: absolute;
    left: 64px;
    top: 185px;
    width: 950px;
    color: #FFFFFF;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.08;
    text-transform: uppercase;
    z-index: 5;
  }
  #headline .accent { color: #FFD23F; }

  #script-line {
    position: absolute;
    left: 66px;
    z-index: 5;
    color: #FFD23F;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 42px;
    transform: rotate(-2deg);
    display: {{SCRIPT_DISPLAY}};
  }

  #body {
    position: absolute;
    left: 64px;
    bottom: 90px;
    width: 820px;
    color: #FFE5B0;
    font-size: 30px;
    font-weight: 600;
    line-height: 1.4;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="post">
    <img class="bg" src="{{PHOTO_SRC}}" alt="coxinha grande Santa Coxinha" />
    <div id="scrim"></div>

    <div id="tag">santa coxinha</div>
    <div id="slide-num">{{SLIDE_NUM}}</div>

    <div id="label"><span>{{LABEL}}</span></div>
    <div id="headline">{{HEADLINE}}</div>
    <div id="script-line" style="top: {{SCRIPT_TOP}}px;">{{SCRIPT_LINE}}</div>
    <div id="body">{{BODY}}</div>
  </div>
</body>
</html>
