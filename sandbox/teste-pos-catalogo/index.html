<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /*
    Modelo 1 do catálogo (MONA — manifesto conceitual), aplicado com disciplina:
    preto/branco/amarelo SÓ, zero foto, quebra de linha 100% manual (cada <br>/div é decisão
    minha, não auto-wrap de CSS) — ver niches-library/design-principles/catalogo-referencias.md
  */
  #post {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #0A0A0A;
    font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
  }

  #label-top {
    position: absolute;
    top: 64px;
    left: 64px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #label-tag {
    position: absolute;
    top: 64px;
    right: 64px;
    color: #6b6b6b;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 2px;
  }

  #headline {
    position: absolute;
    left: -10px;
    top: 300px;
  }
  .h-line {
    font-weight: 900;
    line-height: 0.92;
    white-space: nowrap;
    letter-spacing: -3px;
  }
  #l1 { color: #F2D200; font-size: 168px; padding-left: 24px; }
  #l2 { color: #FFFFFF; font-size: 168px; padding-left: 24px; }
  #l3 { color: #F2D200; font-size: 99px; padding-left: 24px; letter-spacing: -2px; }

  #sub {
    position: absolute;
    left: 70px;
    top: 870px;
    width: 620px;
    color: #FFFFFF;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.3;
  }

  #rule {
    position: absolute;
    left: 70px;
    top: 1180px;
    width: 220px;
    height: 4px;
    background: #F2D200;
  }
  #caption {
    position: absolute;
    left: 70px;
    top: 1215px;
    width: 700px;
    color: #8a8a8a;
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div id="post">
    <div id="label-top">núcleo estúdio</div>
    <div id="label-tag">manifesto · 01</div>

    <div id="headline">
      <div class="h-line" id="l1">MARCA</div>
      <div class="h-line" id="l2">SEM</div>
      <div class="h-line" id="l3">CONSISTÊNCIA</div>
    </div>

    <div id="sub">não é identidade.<br>é sorte.</div>

    <div id="rule"></div>
    <div id="caption">cada peça sem direção clara é mais um<br>fragmento de Frankenstein na sua marca.</div>
  </div>
</body>
</html>
