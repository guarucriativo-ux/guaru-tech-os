<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
#stage{width:1080px;height:1350px;position:relative;background:#1789C6;font-family:'Poppins',sans-serif;color:#fff;overflow:hidden}
.blob{position:absolute;right:-180px;top:-160px;width:520px;height:520px;border-radius:46% 54% 58% 42%/52% 44% 56% 48%;background:#fff;opacity:.10}
#kick{position:absolute;top:150px;left:110px;font-weight:600;font-size:26px;letter-spacing:6px;text-transform:uppercase;color:#eafaff}
#wrap{position:absolute;left:110px;top:560px;width:860px}
#l1{font-weight:800;font-size:118px;line-height:.98;letter-spacing:-2px}
#l2{font-weight:800;font-size:118px;line-height:1.0;letter-spacing:-2px;margin-top:6px;display:flex;align-items:center;gap:18px}
#hlbox{position:relative;display:inline-block;padding:0 .14em}
#hlfill{position:absolute;inset:0;background:#8FE3D0;border-radius:14px;transform-origin:left center}
#dura{position:relative;color:#10303A}
#spark{position:absolute;left:110px;top:470px;font-size:64px;color:#8FE3D0}
#foot{position:absolute;bottom:150px;left:110px;font-weight:600;font-size:26px;letter-spacing:4px;color:#cdeefb}
</style></head>
<body><div id="stage">
  <div class="blob" id="blob"></div>
  <div id="kick">&#10022;&nbsp; LUME ODONTOLOGIA</div>
  <div id="spark">&#10022;</div>
  <div id="wrap">
    <div id="l1">CLAREAMENTO</div>
    <div id="l2"><span id="que">que</span><span id="hlbox"><span id="hlfill"></span><span id="dura">dura.</span></span></div>
  </div>
  <div id="foot">@lume.odontologia</div>
</div>
<script>
const P=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}; // back ease-out
window.setTime=(t)=>{
  const k=eo(P(t,0.0,0.5));
  kick.style.opacity=k; kick.style.transform=`translateY(${(1-k)*22}px)`;
  const s1=P(t,0.25,0.85), e1=eob(s1);
  l1.style.opacity=Math.min(1,s1*1.4); l1.style.transform=`scale(${0.84+0.16*e1})`; l1.style.transformOrigin='left center';
  que.style.opacity=eo(P(t,0.85,1.2));
  const sd=P(t,1.0,1.5), ed=eob(sd);
  const hb=document.getElementById('hlbox');
  dura.style.opacity=Math.min(1,sd*1.4); hb.style.transform=`translateY(${(1-ed)*26}px)`;
  hlfill.style.transform=`scaleX(${eo(P(t,1.5,2.0))})`;
  const sp=P(t,1.85,2.35); const pulse=Math.sin(sp*Math.PI); // 0..1..0
  spark.style.transform=`scale(${1+0.5*pulse}) rotate(${pulse*25}deg)`; spark.style.opacity=eo(P(t,1.7,2.0));
  foot.style.opacity=eo(P(t,2.1,2.5));
  blob.style.transform=`scale(${0.9+0.1*eo(P(t,0,1.2))})`;
};
window.setTime(0);
</script></body></html>
